# Keep the board defaults and only add the minimum Arduino-required features.
CONFIG_ARM_MPU=y
# CONFIG_HW_STACK_PROTECTION=y
CONFIG_TRUSTED_EXECUTION_SECURE=y
CONFIG_ARM_TRUSTZONE_M=y

# This board only exposes 64KB of secure RAM. The loader's default
# heap/stack sizes (32KB each) alone consume all of it, overflowing
# RAM. Shrink them to fit.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

# Default LLEXT heap (32KB) plus the above still leaves almost no headroom
# for the kernel/drivers on this 64KB chip, corrupting RAM at boot. Shrink
# it too; small sketches don't need a large extension heap.
CONFIG_LLEXT_HEAP_SIZE=16

CONFIG_LLEXT_STORAGE_WRITABLE=n

CONFIG_GPIO=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# The board's QSPI/flash controller is not provided by the current Zephyr tree
# in a way that exposes the flash_map APIs required by the Arduino loader.
# Disable this so the loader build does not reference missing symbols.
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n

CONFIG_SHARED_INTERRUPTS=y

CONFIG_BOOT_BANNER=n

CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n

CONFIG_FLASH=n
CONFIG_FLASH_MAP=n

CONFIG_BUILD_OUTPUT_BIN=n

CONFIG_BOOTLOADER_MCUBOOT=n