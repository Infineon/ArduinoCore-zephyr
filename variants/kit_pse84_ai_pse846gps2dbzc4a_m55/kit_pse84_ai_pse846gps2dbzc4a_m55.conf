#
# Kconfig overlay for KIT-PSE84-AI (PSOC Edge E84, CM55)
#
# EXPERIMENTAL / SPIKE: not yet validated end-to-end on hardware.
#
# NOTE: The board defconfig already provides:
#   CONFIG_GPIO=y
#   CONFIG_SERIAL=y
#   CONFIG_UART_CONSOLE=y
#   CONFIG_FPU=y
#   CONFIG_CORTEX_M_SYSTICK=y
#
# Unlike the CM33-secure variant, CM55 has no TrustZone-M
# (SOC_SERIES_PSE84_M55 does not select ARM_TRUSTZONE_M), so there is no
# CONFIG_ARM_TRUSTZONE_M / CONFIG_TRUSTED_EXECUTION_SECURE to account for here.

# --- Bootloader ---
# This image is released via sysbuild as the companion app alongside the
# CM33 'enable_cm55' helper, matching kit_pse84_ai's own sysbuild.cmake.
# Force MCUBoot off for Infineon KIT-PSE84-AI (PSOC Edge E84), consistent
# with the CM33-secure variant.
CONFIG_BOOTLOADER_MCUBOOT=n

# --- Stack / heap sizing for Arduino + LLEXT runtime ---
# CM55 SRAM (m55_data) is 256 KB - roughly double CM33-secure's 132 KB,
# so headroom is less constrained, but kept conservative for this first
# spike pending real profiling.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_LLEXT_HEAP_SIZE=32
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- XIP flash: read sketch directly from memory, no RAM copy needed ---
CONFIG_LLEXT_STORAGE_WRITABLE=n

# --- Peripheral drivers ---
CONFIG_I2C=y
CONFIG_SPI=y

# Required for arch_irq_disconnect_dynamic, which is exported by
# loader/llext_exports.c when CONFIG_DYNAMIC_INTERRUPTS is enabled.
# Zephyr provides that symbol from arch/common/shared_irq.c only when
# CONFIG_SHARED_INTERRUPTS is enabled.
CONFIG_SHARED_INTERRUPTS=y

# Disable boot banner to save flash and reduce startup time; the loader doesn't need it, and the sketch can print its own banner if desired
CONFIG_BOOT_BANNER=n

# --- Override board defconfig for Arduino LLEXT loader ---
# Board defconfig enables MPU + HW_STACK_PROTECTION which the loader doesn't need
# and ASSERT which adds code size
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n

# The PSE84 QSPI controller DTS entry uses "infineon,qspi-flash-mtb-hal" which has no
# Zephyr binding, so the flash driver never compiles. This is the same physical
# flash controller/binding issue as the CM33-secure variant (see its own .conf
# for the full explanation) - disabling CONFIG_FLASH here too prevents the
# build from trying to compile/link flash symbols; loader/main.c falls back to
# a direct XIP memcpy() from the partition's own address when CONFIG_FLASH_MAP
# is off.
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n

# --- Build output ---
# CONFIG_BUILD_OUTPUT_BIN=n  # removed: conflicts with Zephyr default; use HEX instead
