name: Test on-target cores (Infineon)

on:
  workflow_run:
    workflows:
      - Package, test and upload core (Infineon)
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  install-core:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        contains(fromJSON('["push","pull_request"]'), github.event.workflow_run.event)
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Download core package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ArduinoCore-*.tar.bz2
          path: package-data/
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download package index
        uses: actions/download-artifact@v8
        with:
          pattern: package_arduino_zephyr_*_ci_index.json
          path: package-data/
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install downloaded cores from the package index
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          indexes=(package-data/package_arduino_zephyr_*_ci_index.json)
          archives=(package-data/ArduinoCore-*.tar.bz2)

          if (( ${#indexes[@]} != 1 )); then
            echo "::error::Expected one package index; found ${#indexes[@]}"
            exit 1
          fi
          if (( ${#archives[@]} == 0 )); then
            echo "::error::No core package archives were downloaded"
            exit 1
          fi

          index_file=package-data/package_index.json
          cp "${indexes[0]}" "$index_file"

          # Serve the downloaded archives locally so Arduino CLI does not need
          # to authenticate against the GitHub artifact API.
          for archive in "${archives[@]}"; do
            filename=$(basename "$archive")
            jq \
              --arg filename "$filename" \
              --arg url "http://127.0.0.1:8765/$filename" \
              '.packages |= map(
                .platforms |= map(
                  if .archiveFileName == $filename then .url = $url else . end
                )
              )' \
              "$index_file" > package-data/package_index.tmp
            mv package-data/package_index.tmp "$index_file"
          done

          (
            cd package-data
            python3 -m http.server 8765 --bind 127.0.0.1
          ) >/tmp/package-index-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          index_url=http://127.0.0.1:8765/package_index.json
          for attempt in {1..20}; do
            if curl --fail --silent "$index_url" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "$index_url" >/dev/null

          arduino-cli core update-index --additional-urls "$index_url"

          mapfile -t cores < <(
            jq -r '
              .packages[].platforms[]
              | select(.url | startswith("http://127.0.0.1:8765/"))
              | "arduino:\(.architecture)@\(.version)"
            ' "$index_file"
          )

          if (( ${#cores[@]} == 0 )); then
            echo "::error::No downloaded core archives matched package-index entries"
            exit 1
          fi

          for core in "${cores[@]}"; do
            echo "Installing $core"
            arduino-cli core install --additional-urls "$index_url" "$core"
          done

          arduino-cli core list
